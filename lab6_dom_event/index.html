<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praktikum DOM dan Event</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Latihan 1 & 2 -->
    <h1 id="judul">Latihan DOM</h1>
    <p id="pesan">Belum ada tindakan.</p>
    <button id="tombolAksi" type="button">Klik Saya</button>

    <hr />

    <!-- Latihan 3 -->
    <section>
      <h2>Latihan 3: Ubah Gaya CSS</h2>
      <p id="teksGaya">Paragraf ini akan berubah gayanya saat tombol diklik.</p>
      <button id="tombolGaya" type="button">Ubah Gaya</button>
    </section>

    <hr />

    <!-- Latihan 4 -->
    <section>
      <h2>Latihan 4: Penghitung Karakter</h2>
      <label for="namaInput">Nama:</label>
      <input type="text" id="namaInput" maxlength="40" />
      <p>Jumlah karakter: <span id="jumlahKarakter">0</span></p>
    </section>

    <hr />

    <!-- Latihan 5 -->
    <section>
      <h2>Latihan 5: Validasi Form Pendaftaran</h2>
      <form id="formPendaftaran" novalidate>
        <label for="nama">Nama lengkap</label><br />
        <input id="nama" name="nama" type="text" /><br /><br />

        <label for="email">Email</label><br />
        <input id="email" name="email" type="email" /><br /><br />

        <label for="usia">Usia</label><br />
        <input
          id="usia"
          name="usia"
          type="number"
          min="17"
          max="100"
        /><br /><br />

        <button type="submit">Daftar</button>
      </form>
      <p id="pesanForm" aria-live="polite"></p>
    </section>

    <hr />

    <!-- Latihan 6 -->
    <section>
      <h2>Latihan 6: Daftar Tugas Sederhana (To-do List)</h2>
      <label for="inputTugas">Tugas baru</label><br />
      <input id="inputTugas" type="text" />
      <button id="tambahTugas" type="button">Tambah</button>
      <p id="pesanTugas" aria-live="polite"></p>
      <ul id="daftarTugas"></ul>
    </section>
  </body>
</html>
